<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premier League Predictions</title>

<style>
  :root{
    --pl-purple: #3d1a68;
    --pl-purple-dark: #2b1149;
    --lav: #ece7f5;
    --lav-line: #ded6ee;
    --page-bg: #f2f1f4;
    --ink: #1c1626;
    --muted: #56506a;
    --req: #d1274a;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--page-bg);
    color: var(--ink);
  }

  /* ---------------- HEADER ---------------- */
  .header{
    background: var(--pl-purple);
    color:#fff;
    padding: 28px 40px 30px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 22px;
  }
  .brand svg{ width:34px; height:34px; }
  .brand-text{
    font-weight:700;
    font-size: 15px;
    line-height:1.15;
  }
  .brand-text .sub{
    font-weight:600;
    font-size:11px;
    letter-spacing:.02em;
    color:#cfc4e8;
  }
  .header h1{
    margin:0 0 10px;
    font-size: 34px;
    font-weight:700;
  }
  .header .how{
    margin:0;
    font-size: 15px;
    font-weight:600;
    color:#e8e2f5;
  }

  /* ---------------- LOAD CONTROLS ---------------- */
  .controls{
    max-width: 760px;
    margin: 20px auto 0;
    padding: 14px 20px;
    background:#fff;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .controls label{ font-size:14px; font-weight:600; color:var(--muted); }
  .controls input[type=number]{
    width:64px;
    padding:7px 8px;
    border:1px solid #d5d0e0;
    border-radius:6px;
    font-size:14px;
  }
  .controls button{
    padding:8px 16px;
    border:none;
    border-radius:6px;
    background: var(--pl-purple);
    color:#fff;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .controls button:hover{ background: var(--pl-purple-dark); }
  .controls .status{ font-size:13px; color:var(--muted); }

  /* ---------------- BODY ---------------- */
  .notice{
    max-width:760px;
    margin: 24px auto 4px;
    padding: 0 4px;
    font-size:14px;
    color: var(--ink);
  }
  .required-note{
    max-width:760px;
    margin: 10px auto 20px;
    padding: 0 4px;
    font-size:14px;
  }
  .required-note .star{ color:var(--req); }

  form{ max-width:760px; margin: 0 auto 60px; }

  .qblock{
    background:#fff;
    border-radius:8px;
    overflow:hidden;
    margin-bottom:18px;
    box-shadow:0 2px 6px rgba(0,0,0,.06);
  }
  .qheader{
    background: var(--lav);
    padding: 18px 24px 20px;
  }
  .qnum{
    display:inline-block;
    background: var(--pl-purple);
    color:#fff;
    font-size:13px;
    font-weight:700;
    padding:4px 10px;
    border-radius:4px;
    margin-bottom:14px;
  }
  .qtitle{
    font-size:16px;
    font-weight:600;
    margin:0 0 14px;
  }
  .star{ color:var(--req); }

  .fixture-card{
    background:#fff;
    border-radius:6px;
    padding: 20px 30px 16px;
  }
  .fixture-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 60px;
  }
  .team{
    text-align:center;
    width: 160px;
  }
  .team img{
    width:80px;
    height:80px;
    object-fit:contain;
    margin-bottom:10px;
  }
  .team .badge-fallback{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#f0eef5;
    border:1px solid var(--lav-line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:var(--muted);
    margin: 0 auto 10px;
    text-align:center;
    padding:4px;
  }
  .team-name{
    font-size:20px;
    font-weight:700;
  }
  .vs{
    font-size:18px;
    font-weight:600;
    color: var(--muted);
    align-self: center;
    margin-top: 40px;
  }

  .answer-wrap{ padding: 0 0 4px; }
  .answer-input{
    width:100%;
    padding: 12px 14px;
    border:none;
    border-top:1px solid #eee;
    font-size:15px;
    border-radius: 0 0 8px 8px;
  }
  .answer-input:focus{ outline:2px solid var(--pl-purple); outline-offset:-2px; }
  .hint{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin: -8px 0 12px 4px;
  }

  .submit-row{
    max-width:760px;
    margin: 0 auto 60px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .submit-btn{
    padding: 10px 26px;
    background: var(--pl-purple);
    color:#fff;
    border:none;
    border-radius:6px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .submit-btn:hover{ background: var(--pl-purple-dark); }
  .submit-msg{ font-size:14px; color:var(--muted); }

  .confirmation{
    max-width:760px;
    margin: 40px auto;
    background:#fff;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
    padding: 40px;
    text-align:center;
  }
  .confirmation h2{ margin-top:0; color: var(--pl-purple); }
  .confirmation button{
    margin-top: 20px;
    padding: 10px 22px;
    border: 1px solid var(--pl-purple);
    background:#fff;
    color: var(--pl-purple);
    border-radius:6px;
    font-weight:600;
    cursor:pointer;
  }

  .empty-state, .loading-state{
    max-width:760px;
    margin: 40px auto;
    text-align:center;
    color: var(--muted);
    font-size:15px;
  }
</style>
</head>

<body>

  <div class="header">
    <div class="brand">
      <div class="brand-text">
        Premier League Predictions<br>
      </div>
    </div>
    <h1 id="pageTitle">Matchday <span id="mdLabel">1</span></h1>
    <p class="how">How to answer: Home Team Score - Away Team Score</p>
  </div>

  <div class="controls" style="display:none;">
    <label>Matchday:
      <input type="number" id="matchdayInput" min="1" max="38" value="1">
    </label>
    <span class="status" id="statusMsg"></span>
  </div>

  <form id="predictionForm">
    <div class="qblock">
      <div class="qheader">
        <span class="qnum">1</span>
        <p class="qtitle">Name <span class="star">*</span></p>
      </div>
      <div class="answer-wrap">
        <input class="answer-input" type="text" id="nameInput" placeholder="Enter your answer" required>
      </div>
    </div>

    <div id="fixtureQuestions"></div>
  </form>

  <div class="submit-row" id="submitRow" style="display:none;">
    <button class="submit-btn" id="submitBtn" type="button">Submit</button>
  </div>

  <div id="confirmationBox"></div>

  <script>

    // ============================================================
    // SETTINGS (reused from original fixtures-graphics tool)
    // ============================================================

    const workerUrl =
   		 'https://plp-fixtures-graphics.webadmin-a16.workers.dev/';

    const formspreeEndpoint =
		'https://postto.dev/api/v1/send/ep_DOjvWEJSONO35N6L';

    const hullCityBadge =
      'http://fg.plp.blacksinc.co.uk/HullCity.png';

    let currentFixtures = [];

    // ============================================================
    // TEAM NAME CLEANING
    // ============================================================

    function cleanName(name) {
      const map = {
        "Wolverhampton Wanderers": "Wolves",
        "Wolverhampton Wanderers FC": "Wolves",
        "West Ham United": "West Ham",
        "West Ham United FC": "West Ham",
        "Tottenham Hotspur": "Tottenham",
        "Tottenham Hotspur FC": "Tottenham",
        "AFC Bournemouth": "Bournemouth",
        "Sunderland A": "Sunderland",
        "Sunderland AFC": "Sunderland",
        "Brighton & Hove Albion": "Brighton",
        "Brighton & Hove Albion FC": "Brighton",
        "Hull City AFC": "Hull City",
        "Hull City FC": "Hull City",
        "Hull City": "Hull City"
      };

      const cleaned = name.replace(/\s+FC$/i, "");
      return map[name] || map[cleaned] || cleaned;
    }

    // ============================================================
    // GET TEAM CREST
    // ============================================================

    function getTeamCrest(team) {
      if (
        team.name === "Hull City AFC" ||
        team.name === "Hull City FC" ||
        team.name === "Hull City"
      ) {
        return hullCityBadge;
      }
      return team.crest;
    }

    // ============================================================
    // GET LOGO URL (via worker proxy, matches original tool)
    // ============================================================

    function getLogoUrl(team) {
      const crest = getTeamCrest(team);
      return `${workerUrl}?url=${encodeURIComponent(crest)}`;
    }

    // ============================================================
    // FETCH FIXTURES
    // ============================================================

    async function fetchFixtures(matchday) {
      const apiUrl =
        'https://api.football-data.org/v4/competitions/PL/matches?season=2026&matchday='
        + matchday;

      const url = `${workerUrl}?url=${encodeURIComponent(apiUrl)}`;

      const res = await fetch(url);
      if (!res.ok) {
        throw new Error(`Failed to fetch fixtures: HTTP ${res.status}`);
      }
      const data = await res.json();
      return data.matches;
    }

    // ============================================================
    // FORMAT KICKOFF LIKE "Sunday 16:00"
    // ============================================================

    function formatKickoff(utcDate) {
      const d = new Date(utcDate);
      const weekday = d.toLocaleDateString('en-GB', { weekday: 'long' });
      const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
      return `${weekday} ${time}`;
    }

    // ============================================================
    // BUILD ONE FIXTURE QUESTION BLOCK
    // ============================================================

    function buildFixtureBlock(fixture, index) {
      const qnum = index + 2; // question 1 is Name

      const homeName = cleanName(fixture.homeTeam.name);
      const awayName = cleanName(fixture.awayTeam.name);
      const kickoff = fixture.utcDate ? formatKickoff(fixture.utcDate) : '';

      const block = document.createElement('div');
      block.className = 'qblock';

      block.innerHTML = `
        <div class="qheader">
          <span class="qnum">${qnum}</span>
          <p class="qtitle">${homeName} v ${awayName}${kickoff ? ` (${kickoff})` : ''} <span class="star">*</span></p>
          <div class="fixture-card">
            <div class="fixture-row">
              <div class="team">
                <img data-fallback-name="${homeName}" src="${getLogoUrl(fixture.homeTeam)}" alt="${homeName} crest">
                <div class="team-name">${homeName}</div>
              </div>
              <div class="vs">vs</div>
              <div class="team">
                <img data-fallback-name="${awayName}" src="${getLogoUrl(fixture.awayTeam)}" alt="${awayName} crest">
                <div class="team-name">${awayName}</div>
              </div>
            </div>
          </div>
        </div>
        <div class="answer-wrap">
          <input class="answer-input" type="text" data-home="${homeName}" data-away="${awayName}" placeholder="e.g. 2-1" pattern="^\\s*\\d+\\s*-\\s*\\d+\\s*$" required>
        </div>
      `;

      // Fallback if a crest image fails to load
      block.querySelectorAll('img').forEach(img => {
        img.addEventListener('error', () => {
          const wrap = document.createElement('div');
          wrap.className = 'badge-fallback';
          wrap.textContent = img.dataset.fallbackName || '';
          img.replaceWith(wrap);
        });
      });

      return block;
    }

    // ============================================================
    // LOAD FIXTURES INTO THE FORM
    // ============================================================

    const fixturesContainer = document.getElementById('fixtureQuestions');
    const statusMsg = document.getElementById('statusMsg');
    const submitRow = document.getElementById('submitRow');

    async function loadFixtures(matchday) {
      document.getElementById('mdLabel').textContent = matchday;

      fixturesContainer.innerHTML = '';
      submitRow.style.display = 'none';
      statusMsg.textContent = 'Loading fixtures…';

      try {
        const matches = await fetchFixtures(matchday);
        currentFixtures = matches;

        if (!matches.length) {
          fixturesContainer.innerHTML = '<p class="empty-state">No fixtures found for this matchday.</p>';
          statusMsg.textContent = '';
          return;
        }

        matches.forEach((fixture, i) => {
          fixturesContainer.appendChild(buildFixtureBlock(fixture, i));
        });

        submitRow.style.display = 'flex';
        statusMsg.textContent = `Loaded ${matches.length} fixtures.`;
      } catch (error) {
        console.error('FIXTURE ERROR:', error);
        fixturesContainer.innerHTML = '<p class="empty-state">Error loading fixtures. Check the console for details.</p>';
        statusMsg.textContent = '';
      }
    }

    // Update the URL (without reloading the page) so the matchday is
    // shareable/bookmarkable, then reload fixtures for the new value.
    function setMatchdayInUrl(matchday) {
      const url = new URL(window.location.href);
      url.searchParams.set('matchday', matchday);
      window.history.replaceState({}, '', url);
    }

    const matchdayInput = document.getElementById('matchdayInput');

    matchdayInput.addEventListener('change', () => {
      const matchday = matchdayInput.value;
      setMatchdayInUrl(matchday);
      loadFixtures(matchday);
    });

    // ============================================================
    // INITIAL LOAD — read matchday straight from the URL
    // e.g. yourpage.html?matchday=5
    // ============================================================

    (function init() {
      const params = new URLSearchParams(window.location.search);
      const matchdayFromUrl = params.get('matchday');
      const matchday = matchdayFromUrl && Number(matchdayFromUrl) > 0 ? matchdayFromUrl : '1';

      matchdayInput.value = matchday;
      setMatchdayInUrl(matchday);
      loadFixtures(matchday);
    })();

    // ============================================================
    // SUBMIT — VALIDATE + SHOW CONFIRMATION + OFFER DOWNLOAD
    // ============================================================

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const form = document.getElementById('predictionForm');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const matchday = document.getElementById('matchdayInput').value;
      const name = document.getElementById('nameInput').value.trim();
      const answers = Array.from(document.querySelectorAll('.answer-input[data-home]')).map(input => ({
        home: input.dataset.home,
        away: input.dataset.away,
        prediction: input.value.trim()
      }));

      const lines = [
        `Name: ${name}`,
        `Matchday: ${matchday}`,
        '',
        ...answers.map(a => `${a.home} v ${a.away}: ${a.prediction}`)
      ];
      const textBlob = lines.join('\n');

      // Payload sent to Formspree. Flat fields read cleanly in the Formspree
      // dashboard/email notification; predictions_json carries the structured version.
      const payload = {
        name,
        matchday,
        predictions_json: JSON.stringify(answers)
      };
      answers.forEach(a => {
        payload[`${a.home} v ${a.away}`] = a.prediction;
      });

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting…';

      let submitError = null;
      try {
        if (!formspreeEndpoint.includes('YOUR_FORM_ID')) {
          const res = await fetch(formspreeEndpoint, {
            method: 'POST',
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error || `Formspree returned HTTP ${res.status}`);
          }
        } else {
          throw new Error('Formspree endpoint not configured yet.');
        }
      } catch (error) {
        console.error('SUBMIT ERROR:', error);
        submitError = error.message;
      }

      form.style.display = 'none';
      submitRow.style.display = 'none';

      const box = document.getElementById('confirmationBox');
      box.innerHTML = submitError
        ? `
        <div class="confirmation">
          <h2>Couldn't submit your predictions</h2>
          <p>${submitError} Your answers weren't lost — download them below and try again later.</p>
          <button id="downloadBtn">Download my predictions</button>
        </div>
      `
        : `
        <div class="confirmation">
          <h2>Your predictions have been recorded</h2>
          <p>Thanks, ${name || 'friend'}! Here's a copy for your records.</p>
          <button id="downloadBtn">Download my predictions</button>
        </div>
      `;

      document.getElementById('downloadBtn').addEventListener('click', () => {
        const blob = new Blob([textBlob], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `matchday-${matchday}-predictions.txt`;
        a.click();
        URL.revokeObjectURL(url);
      });
    });

  </script>

</body>
</html>
